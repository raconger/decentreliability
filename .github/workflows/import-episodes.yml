name: Import podcast episodes

on:
  schedule:
    # Daily at 15:00 UTC, after the usual JustCast publish time
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: import-episodes

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import new episodes from the RSS feed
        run: python3 scripts/import_episodes.py

      - name: Commit and push new episodes
        id: commit
        run: |
          if [ -z "$(git status --porcelain _episodes)" ]; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _episodes
          git commit -m "Import new podcast episodes"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own
      - name: Request a GitHub Pages build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
