title: Decent Reliability
description: A podcast about the science, art, and history of reliability management.

podcast:
  host: Ryan Conger
  feed: "https://feed.justcast.com/shows/05554e06be7642a6f4acd5fa420f56a6081dc1a8/audioposts.rss"
  cover: /assets/cover.jpg
  # Add listing URLs here to show them as subscribe buttons
  apple: ""
  spotify: ""
url: "https://decentreliability.com"
baseurl: ""

permalink: /:categories/:title/

collections:
  essays:
    output: true
    permalink: /essay/:title/
  posts:
    output: true
    permalink: /post/:title/
  episodes:
    output: true
    permalink: /episodes/:title/

defaults:
  - scope:
      path: ""
      type: "essays"
    values:
      layout: "essay"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "episodes"
    values:
      layout: "episode"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
