title: Decent Reliability
description: A short line describing who you are and what you do.
url: "https://decentreliability.com"
baseurl: ""

permalink: /:categories/:title/

collections:
  essays:
    output: true
    permalink: /essay/:title/
  posts:
    output: true
    permalink: /post/:title/

defaults:
  - scope:
      path: ""
      type: "essays"
    values:
      layout: "essay"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
